<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Q&amp;A 助手</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="bar">
  <h1 id="title">Q&amp;A 助手</h1>
  <p id="status" class="status" role="status">連線中</p>
  <div class="levels" aria-hidden="true">
    <span class="level">Meet <meter id="levelTab" min="0" max="100" value="0"></meter></span>
    <span class="level">我 <meter id="levelMic" min="0" max="100" value="0"></meter></span>
  </div>
  <div class="actions">
    <button id="btnListen" class="primary">開始聆聽</button>
    <button id="btnNow" title="不等停頓，立刻回答最近的聽眾問題">現在回答</button>
    <details class="settings">
      <summary>設定</summary>
      <div class="panel">
        <label><input type="checkbox" id="withMic" checked> 也收我的麥克風</label>
        <label><input type="checkbox" id="auto" checked> 自動擷取問題</label>
        <p id="ctxInfo" class="ctx-info"></p>
        <a id="dlTranscript" href="#" hidden>下載逐字稿</a>
        <a id="dlQa" href="#" hidden>下載問答紀錄</a>
      </div>
    </details>
  </div>
</header>
<p id="warn" class="warn" role="alert" hidden></p>

<main class="layout">
  <section class="stage">
    <button id="jumpLatest" class="jump" hidden>有新的回答，回到最新</button>
    <article id="cue" class="cue empty" aria-live="polite">
      <p class="cue-question"></p>
      <p class="cue-speech">按「開始聆聽」，選 Meet 的分頁並打開「同時分享分頁音訊」。聽眾提問後，可以直接唸的回答會出現在這裡。</p>
      <div class="cue-meta"></div>
    </article>
    <ol id="history" class="history" aria-label="先前的問題"></ol>
  </section>

  <details class="transcript" open>
    <summary>逐字稿</summary>
    <div id="lines" class="lines"></div>
    <p id="interim-聽眾" class="interim"></p>
    <p id="interim-我" class="interim me"></p>
  </details>
</main>

<form id="askForm" class="ask">
  <input id="askInput" placeholder="沒抓到的問題，打在這裡按 Enter" autocomplete="off" aria-label="手動輸入問題">
  <button type="submit">送出</button>
</form>
<script src="/static/app.js"></script>
</body>
</html>
