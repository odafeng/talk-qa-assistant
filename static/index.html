<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SurgiFlowVid Q&amp;A 助手</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header>
  <h1>SurgiFlowVid Q&amp;A 助手</h1>
  <span id="status" class="pill">連線中…</span>
  <div class="controls">
    <button id="btnTab" class="primary">聆聽 Meet 分頁</button>
    <button id="btnMic">改用麥克風</button>
    <button id="btnStop" disabled>停止</button>
    <label class="toggle"><input type="checkbox" id="auto" checked> 自動回答</label>
    <meter id="level" min="0" max="100" value="0" title="收音音量"></meter>
  </div>
</header>
<div id="warn" class="warn" hidden></div>
<main>
  <section class="transcript">
    <h2>逐字稿（其他人的聲音）</h2>
    <div id="segments"></div>
    <div id="pending" class="pending"></div>
    <div id="interim" class="interim"></div>
  </section>
  <section class="answers">
    <h2>回答</h2>
    <div id="answers"></div>
  </section>
</main>
<form id="askForm">
  <input id="askInput" placeholder="手動輸入問題，按 Enter 送出（自動辨識沒抓到時用）" autocomplete="off">
  <button type="submit" class="primary">送出</button>
</form>
<script src="/static/app.js"></script>
</body>
</html>
