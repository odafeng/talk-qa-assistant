# Describe the talk the assistant should answer for. Keep the real file next to your talk
# materials (it holds personal details) and point TALK_CONFIG at it.
# Relative paths are resolved against this file's folder.

title = "PaperName（First Author et al., Venue 2026）"
speaker = "王小明（某某醫院外科醫師、博士生）"
venue = "某某研討會"

# The paper: a PDF (needs `pdftotext` from poppler) or a .txt with form-feed page breaks.
paper = "paper.pdf"

# Anything the speaker prepared: script, outline, Q&A notes. Markdown or plain text.
notes = ["speaker_script.md", "outline.md"]

# Optional: an open-slide deck (slides/<id>/index.tsx) so answers can say which page to show.
slides = "deck/slides/my-talk/index.tsx"
body_pages = 30  # pages after this are listed as Backup

# Custom vocabulary for Gemini transcription: paper names, datasets, metrics.
vocabulary = ["PaperName", "DatasetA", "Jaccard"]

# Where transcripts and Q&A logs are written.
sessions = "qa_sessions"
