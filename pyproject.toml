[project]
name = "qa-assistant"
version = "0.1.0"
description = "Live Q&A helper for the SurgiFlowVid seminar: Meet audio -> Gemini Live transcript -> Claude answers"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=2.1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "python-dotenv>=1.0",
    "opencc-python-reimplemented>=0.1.7",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
pythonpath = ["."]
